<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>FMF motion scene</title>
<meta name="fmf-size" content="1080x1080">
<!-- Fonts (ABC Arizona Flare, DM Sans) are injected by render.mjs from the private brand folder. In a plain browser preview they fall back. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<style>
  :root{
    --cornflower:#6A8FFD; --navy:#0e1034; --blue-black:#0C101D; --alice-blue:#E7ECF3;
    --sage:#7CC4A7; --honey:#E0A766; --rose:#E58A97; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1080px;overflow:hidden;background:var(--navy);color:var(--white);
    font-family:'DM Sans',system-ui,sans-serif}
  .stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
  .kicker{font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:var(--cornflower);font-weight:700}
  h1{font-family:'ABC Arizona Flare','Lora',Georgia,serif;font-weight:400;font-size:104px;line-height:1.05;margin:28px 0}
  h1 em{font-style:normal;color:var(--cornflower)}
  .sub{font-size:38px;color:var(--alice-blue);opacity:.85;max-width:900px}
  .bar{position:absolute;left:90px;bottom:110px;height:8px;width:0;background:var(--cornflower);border-radius:4px}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Fill My Funnel</div>
  <h1><span class="w">Your</span> <span class="w">headline</span> <span class="w"><em>lands</em></span> <span class="w">here</span></h1>
  <div class="sub">One supporting line. Keep it short.</div>
  <div class="bar"></div>
</div>
<script>
  // RULE: build one PAUSED timeline and expose it as window.tl. No autoplay, no Date.now(), no random().
  gsap.set('.w', {display:'inline-block'});
  window.tl = gsap.timeline({paused:true, defaults:{ease:'power3.out'}});
  tl.from('.kicker', {y:30, opacity:0, duration:.6})
    .from('.w', {y:80, opacity:0, duration:.7, stagger:.12}, '-=.2')
    .from('.sub', {y:30, opacity:0, duration:.6}, '-=.2')
    .to('.bar', {width:300, duration:.9, ease:'power2.inOut'}, '<')
    .to({}, {duration:1.5}); // hold on the final frame
</script>
</body>
</html>
